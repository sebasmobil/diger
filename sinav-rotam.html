<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#823cdf">
<title>Sınav Rotam</title>
<script>
try{var s=JSON.parse(localStorage.getItem('agsYolArkadasi.v1')||'{}');var t=s.theme||'auto';
document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;
if(s.accent)document.documentElement.style.setProperty('--accent',s.accent)}catch(e){}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--accent:#823cdf;--on-accent:#fff;--bg:#f4f5fb;--card:#fff;--text:#14172b;--muted:#656b85;--line:#e4e7f2;
--soft:color-mix(in srgb,var(--accent) 11%,var(--card));--ok:#16a34a;--warn:#d97706;--bad:#dc2626;color-scheme:light}
:root[data-theme=dark]{--bg:#0d0f1e;--card:#171a2f;--text:#eef0ff;--muted:#9aa1c4;--line:#272b4a;
--soft:color-mix(in srgb,var(--accent) 20%,var(--card));color-scheme:dark}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding-bottom:calc(92px + env(safe-area-inset-bottom));transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:60px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ff5fa2));display:grid;place-items:center;color:var(--on-accent);flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--accent);flex:none;transition:.2s}
.tbtn:active{transform:scale(.92)}.tbtn svg{width:21px;height:21px}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}.bt small{font-size:11px;color:var(--muted);font-weight:700}
.pop{position:absolute;right:16px;top:64px;width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.pop[hidden]{display:none}
.pop h3{font-size:14px;margin-bottom:10px}
.sw{display:flex;flex-wrap:wrap;gap:9px}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 2.5px var(--text)}
.pop label{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted)}
.pop input[type=color]{width:44px;height:34px;border:0;border-radius:10px;background:none;padding:0;cursor:pointer}
.hue{width:100%;margin-top:12px;-webkit-appearance:none;appearance:none;height:12px;border-radius:99px;background:linear-gradient(90deg,hsl(0 80% 58%),hsl(60 80% 58%),hsl(120 80% 58%),hsl(180 80% 58%),hsl(240 80% 58%),hsl(300 80% 58%),hsl(360 80% 58%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--text)}
.hue::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--text)}
main{padding-top:18px}
section.card,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,23,43,.04)}
.card h2{font-size:17px;letter-spacing:-.01em;margin-bottom:12px}
.muted{color:var(--muted)}.sm{font-size:13px}
.greet{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 2px 4px}
.quote{color:var(--muted);margin:0 2px 16px;font-size:15px}
.hero{border-radius:26px;padding:22px;margin-bottom:14px;color:var(--on-accent);position:relative;overflow:hidden;
background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#1b1038))}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.13)}
.pills{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.pill{background:rgba(255,255,255,.2);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
.big{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px;position:relative;z-index:1}
.big b{font-size:76px;line-height:1;font-weight:900;letter-spacing:-.04em}
.big span{font-size:20px;font-weight:700;opacity:.92}.big em{display:block;font-style:normal;font-size:14px;font-weight:600;opacity:.9}
.hero .sub{opacity:.92;position:relative;z-index:1}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:16px;overflow:hidden;position:relative;z-index:1}
.bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px}
.si{width:56px;height:56px;display:grid;place-items:center;font-size:34px;line-height:1}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat small{color:var(--muted);font-size:12px}
.ring{width:56px;height:56px;display:block}
.ring circle{fill:none;stroke-width:7}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .6s}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:12.5px;font-weight:700}
:root[data-theme=dark] .badge{color:color-mix(in srgb,var(--accent) 55%,#fff)}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;margin-bottom:9px;background:var(--bg);transition:.2s}
.task.on{opacity:.55}.task.on .tt{text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.2s;color:transparent}
.task.on .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot{width:6px;align-self:stretch;border-radius:9px;background:var(--c,var(--accent));flex:none}
.tx{flex:1;min-width:0}.tt{font-weight:650;line-height:1.3}.ts{color:var(--muted);font-size:13px}
.subl{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.mini{border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:5px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.mini:hover{background:var(--soft)}
.note{border-radius:18px;padding:18px;text-align:center;background:var(--soft)}
.note .em{font-size:34px}.note b{display:block;margin:4px 0}
.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px}
.stepper button{width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--accent);font-size:22px;font-weight:700}
.stepper b{min-width:92px;text-align:center;font-size:20px}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}
.b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;font-size:11px;color:var(--muted)}
.b i{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px;opacity:.9}
.b.t span{color:var(--accent);font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=date],input[type=text],input[type=number],select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px}
.kv b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}.kv small{color:var(--muted);font-size:12.5px}
details{border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary:after{content:"›";transform:rotate(90deg);color:var(--muted);font-size:20px;transition:.2s}
details[open] summary:after{transform:rotate(-90deg)}
.drow{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.drow.today{background:var(--soft)}
.dl{width:46px;flex:none;text-align:center;line-height:1.1}.dl b{display:block;font-size:20px}.dl small{color:var(--muted);font-size:12px}
.dc{flex:1;min-width:0;font-size:14px}
.tag{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.ln{display:flex;gap:7px;align-items:baseline;margin-top:3px}.ln i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}.ln em{font-style:normal;color:var(--muted);margin-left:auto;white-space:nowrap}
.ex{display:flex;gap:14px;align-items:center}
.exd{width:74px;flex:none;text-align:center;background:var(--soft);border-radius:16px;padding:10px 4px}
.exd b{display:block;font-size:28px;font-weight:900;line-height:1;letter-spacing:-.03em}.exd small{display:block;font-size:12px;color:var(--muted)}
.ex.main .exd{background:var(--accent);color:var(--on-accent)}.ex.main .exd small{color:inherit;opacity:.85}
.ex.past{opacity:.5}
.star{font-size:22px;color:var(--muted)}.star.on{color:#f59e0b}
.tp{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.tp:last-child{border:0}.tp.on .tt{text-decoration:line-through;color:var(--muted)}.tp.on .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wh{font-weight:800;margin:16px 4px 4px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.agrid{display:grid;grid-template-columns:50px repeat(6,1fr);gap:6px;align-items:center}
.gh{font-size:10.5px;text-align:center;color:var(--muted);font-weight:600}
.gl{font-weight:700;font-size:13px;text-align:left;color:var(--muted)}
.cell{height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);transition:.15s}
.cell.on{background:var(--accent);border-color:var(--accent)}
.fld{margin-bottom:14px}.fld label{display:block;font-size:13.5px;font-weight:650;margin-bottom:6px}
.btn{padding:11px 16px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:var(--soft);color:var(--accent)}.btn.red{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;padding:0 6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:650;color:var(--muted);transition:.2s}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(8,10,25,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px}
.mbox{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:22px;width:min(440px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.mbox h2{font-size:19px;margin-bottom:8px}
.mbox textarea{width:100%;font:13px/1.4 ui-monospace,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:99;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:380px){.big b{font-size:62px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/></svg></div><div class="bt"><span>Sınav Rotam</span><small id="ver">v2.0</small></div></div>
  <button class="tbtn" id="tbtn" data-act="theme" aria-label="Tema"><svg id="ticon" viewBox="0 0 24 24"></svg></button>
  <button class="tbtn" data-act="palette" aria-label="Renk paleti" title="Renk teması"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.9-.9 1.6-1.9-.3-1.1.3-2.1 1.4-2.1H17a4 4 0 0 0 4-4C21 7 17 3 12 3z"/><circle cx="7.6" cy="11.2" r="1.1" fill="currentColor"/><circle cx="10.2" cy="7.4" r="1.1" fill="currentColor"/><circle cx="14.6" cy="7.4" r="1.1" fill="currentColor"/></svg></button>
  <div class="pop" id="pop" hidden>
    <h3>Renk teması</h3>
    <div class="sw" id="sw"></div>
    <label>Özel renk <input type="color" id="cc" data-chg="accent"></label>
    <input type="range" class="hue" id="hue" min="0" max="360" value="250" data-chg="hue" aria-label="Renk tonu">
    <p class="sm muted" style="margin-top:10px">Sonsuz renk: paletten seç, renk kutusuna dokun ya da kaydırıcıyı oynat.</p>
  </div>
</div></header>
<main class="wrap" id="view"></main>
<nav><div class="wrap" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const LS='agsYolArkadasi.v1';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const DAY=864e5;
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DS=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const BLOCKS=['06–09','09–12','12–15','15–18','18–21','21–24'];
const BH=3;
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diffD=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/DAY);
const wdi=d=>(d.getDay()+6)%7;
const fd=d=>d.getDate()+' '+MONTHS[d.getMonth()];
const fdy=d=>fd(d)+' '+d.getFullYear();
const fdl=d=>fdy(d)+' '+DAYS[wdi(d)];
function fh(h){const m=Math.round(h*4)*15;if(m<=0)return'';const H=Math.floor(m/60),M=m%60;return(H?H+' sa':'')+(H&&M?' ':'')+(M?M+' dk':'')}

/* ---------- Veri ---------- */
const SUB={
 fizik:{n:'Fizik',c:'#3b82f6',h:6},kimya:{n:'Kimya',c:'#ec4899',h:6},biyoloji:{n:'Biyoloji',c:'#22c55e',h:6},
 cografya:{n:'Coğrafya',c:'#f97316',h:5},tarih:{n:'Tarih',c:'#b9770e',h:5},egitim:{n:'Eğitim Bilimleri',c:'#8b5cf6',h:5},
 mevzuat:{n:'Mevzuat',c:'#a855f7',h:4},yetenek:{n:'Sözel & Sayısal Yetenek',c:'#14b8a6',h:4},fen:{n:'Genel Fen',c:'#6366f1',h:3}
};
const Y=['yetenek','Sözel Y. 2 sa + Sayısal Y. 2 sa'];
const WK=[
[['fizik','Vektörler – Kuvvet, Tork ve Denge'],['kimya','Atom ve Periyodik Sistem'],['biyoloji','Canlıların Temel Bileşenleri'],['cografya',"Coğrafi Konum ve İklim, Türkiye'nin Yer Şekilleri"],Y],
[['fizik','Tek Boyutta Hareket ve Newton Hareket Yasaları'],['kimya','Modern Atom Teorisi'],['biyoloji','Canlıların Temel Bileşenleri'],['cografya','Yeryüzü Şekilleri, Nüfus, Tarım–Hayvancılık, Madenler'],Y],
[['fizik','İş, Güç, Enerji Yasaları ve Atışlar'],['kimya','Kimyasal Türler Arası Etkileşim'],['biyoloji','Hücre ve Organeller'],['cografya','Enerji Kaynakları, Ulaşım, Turizm ve Bölgesel Kalkınma Projeleri'],Y],
[['fizik','İtme, Momentum ve Basit Harmonik Hareket'],['kimya','Kimyasal Hesaplamalar'],['biyoloji','Sınıflandırma'],['tarih','İlk Türk Devletleri (Osmanlı öncesi)'],['fen','Astronomi çalış']],
[['fizik','Çembersel Hareket, Kütle Çekim Yasası ve Kepler Yasaları'],['kimya','Organik Kimya'],['biyoloji','Hücre Bölünmesi'],['tarih','Osmanlı Devleti'],Y],
[['fizik','Mekanik Fizik Genel Tekrarı'],['kimya','Organik Kimya'],['biyoloji','Kalıtım'],['tarih','Osmanlı Devleti – Atatürk Dönemi'],Y],
[['fizik','Elektrostatik ve Elektrik Akımı'],['kimya','Gazlar'],['biyoloji','Protein Sentezi'],['tarih','Atatürk Dönemi'],Y],
[['fizik','Elektriksel Kuvvet, Alan, İş–Potansiyel; Levha ve Sığaçlar'],['kimya','Sıvı Çözeltiler'],['biyoloji','Hücresel Solunum'],['tarih','Çağdaş Türk ve Dünya Tarihi'],['fen','Yer Bilimi çalış']],
[['fizik','Manyetik Alan ve Kuvvet, Alternatif Akım ve Transformatörler'],['kimya','Kimyasal Tepkimelerde Enerji ve Hız'],['biyoloji','Bitki Fizyolojisi'],['egitim','Eğitimin Temelleri'],Y],
[['fizik','Isı ve Sıcaklık, Termodinamik'],['kimya','Kimyasal Tepkimelerde Denge'],['biyoloji','Sistemler'],['egitim','Eğitimin Temelleri'],Y],
[['fizik','Optik ve Dalgalar'],['kimya','Kimyasal Tepkimelerde Denge'],['biyoloji','Sistemler'],['egitim','Eğitimin Temelleri – 1982 Anayasası'],Y],
[['fizik','Dalgalar ve Atom Fiziği'],['kimya','Elektrokimya'],['biyoloji','Sistemler'],['mevzuat','Mevzuat: 222 – 1739 – 7528 sayılı kanunlar'],['fen','Çevre Bilimi çalış']]
];
const ITEMS=[];

function buildPlan(){
 const today=sod(new Date()),exam=pd(EX[0].d),lastDay=addD(pd(EX[1].d),0);
 let start=pd(S.startDate);if(start<today)start=today;
 const finalN=S.finalDays,N=S.reviewEvery||1,m0=addD(start,-wdi(start));
 const isRev=d=>Math.floor(diffD(m0,d)/7)%N===N-1;
 const maxEnd=addD(exam,-finalN-1);
 const maxWeeks=Math.max(1,Math.floor((diffD(start,exam)-finalN)/7));
 let studyEnd=addD(start,S.weeks*7-1);
 if(studyEnd>maxEnd)studyEnd=maxEnd;
 const rem=ITEMS.filter(i=>!S.done[i.id]);
 const off=new Set(S.offDates);
 const days=[];
 for(let d=start;d<=lastDay;d=addD(d,1)){
  const w=wdi(d),key=iso(d),cap=(S.avail[w]||[]).filter(Boolean).length*BH;
  let type;
  if(d>=exam)type='exam';
  else if(key===iso(addD(exam,-1)))type='eve';
  else if(off.has(key)||w===S.socialDay)type='social';
  else if(d>studyEnd)type=(w===S.reviewDay)?'mock':'final';
  else if(w===S.reviewDay&&isRev(d))type='review';
  else type='study';
  if(cap===0&&['study','review','final','mock'].includes(type))type='off';
  days.push({date:d,key,w,type,cap,tasks:[]});
 }
 const sd=days.filter(x=>x.type==='study');
 const need=rem.reduce((a,i)=>a+HOURS(i),0);
 const capT=sd.reduce((a,x)=>a+x.cap,0);
 const ratio=capT?Math.min(1,need/capT):0;
 let cum=0,given=0,idx=0,left=rem[0]?HOURS(rem[0]):0;const endOf={};
 for(const day of sd){
  cum+=day.cap;
  const target=cum*ratio;let q=target-given;given=target;
  while(q>1e-6&&idx<rem.length){
   const it=rem[idx];
   if(left>=HOURS(it)-1e-9&&q<0.25){given-=q;break}
   let t=Math.min(q,left);
   q-=t;left-=t;
   if(left>1e-6&&left<=0.5&&q<=1e-6){t+=left;given+=left;left=0}
   day.tasks.push({id:it.id,t:it.t,s:SUB[it.s].n,c:SUB[it.s].c,h:t});
   if(left<1e-6){endOf[it.id]=day.key;idx++;left=rem[idx]?HOURS(rem[idx]):0}
  }
 }
 const effDate=id=>S.done[id]?pd(S.done[id]):(endOf[id]?pd(endOf[id]):null);
 const win=(day,a,b)=>ITEMS.filter(i=>{const e=effDate(i.id);if(!e)return false;const df=diffD(e,day.date);return df>=a&&df<=b});
 const acc='var(--accent)';
 let rc=0,fc=0,mc=0;
 for(const day of days){
  if(day.type==='review'){
   rc++;const wk=win(day,1,7*N),sp=rc%2===0?win(day,7*N+8,7*N+28):[];const c=day.cap;
   const nm=l=>l.map(i=>SUB[i.s].n+': '+i.t);
   if(wk.length)day.tasks.push({t:N===1?'Haftalık tekrar':N+' haftalık tekrar',s:N===1?'Geçen hafta bitirdiğin konular':'Son '+N+' haftada bitirdiğin konular',c:acc,h:c*(sp.length?.45:.6),sub:nm(wk)});
   if(sp.length)day.tasks.push({t:'Aralıklı tekrar',s:'2–5 hafta önceki konular unutulmasın',c:acc,h:c*.25,sub:nm(sp)});
   if(!wk.length&&!sp.length)day.tasks.push({t:'Eksik konu tamamlama',s:'Geride kalanları yakala, soru çöz',c:acc,h:c*.8});
   day.tasks.push({t:'Yanlış defteri + mini deneme',s:'Yanlışlarını tekrar çöz',c:acc,h:Math.max(.5,c-day.tasks.reduce((a,t)=>a+t.h,0))});
  }else if(day.type==='final'){
   const f=FCYC[fc%FCYC.length];fc++;
   day.tasks.push({t:f[0],s:'Özet çıkar, soru çöz, eksik konuyu kapat',c:SUB[f[1]].c,h:day.cap});
  }else if(day.type==='mock'){
   mc++;
   day.tasks.push({t:mc%2?'MEB-AGS deneme sınavı':'ÖABT deneme sınavı',s:'Gerçek sınav süresiyle çöz',c:acc,h:Math.min(3,day.cap*.6)});
   day.tasks.push({t:'Deneme analizi',s:'Yanlışları ve boşları konulara ayır',c:acc,h:Math.max(1,day.cap-Math.min(3,day.cap*.6))});
  }else if(day.type==='eve'){
   day.tasks.push({t:'Hafif tekrar, erken uyu',s:'Yeni konu yok. Çantanı ve kimliğini hazırla.',c:'var(--ok)',h:Math.min(2,day.cap||2)});
  }else if(day.type==='exam'){
   const isAgs=iso(day.date)===EX[0].d;
   day.tasks.push({t:isAgs?'MEB-AGS':'MEB-AGS-ÖABT',s:'Derin nefes. Hazırlandın, gerisi sadece uygulama.',c:acc,h:0});
  }
 }
 return{days,rem,need,capT,short:Math.max(0,need-capT),studyEnd,maxWeeks,start,endOf,sdN:sd.length,capped:S.weeks*7-1>diffD(start,studyEnd)};
}

function apStatus(e,today){
 if(!e.ap)return null;
 const a=pd(e.ap[0]),b=pd(e.ap[1]);
 if(today<a)return['Başvuru '+diffD(today,a)+' gün sonra açılır',''];
 if(today<=b)return['Başvuru açık · '+(diffD(today,b)===0?'son gün!':diffD(today,b)+' gün kaldı'),'ok'];
 if(e.late&&today<=pd(e.late))return['Geç başvuru: '+fd(pd(e.late)),'warn'];
 return['Başvuru kapandı',''];
}

 closeall(){$$('#view details').forEach(d=>d.open=d.dataset.now==='1')},
 edith(t){const i=ITEMS.find(x=>x.id===t.dataset.id);
  modal('<h2>Konu süresi</h2><p class="sm muted">'+SUB[i.s].n+' · '+i.t+'</p><div class="row" style="margin:14px 0 6px"><input type="number" id="hv" min="0.25" max="60" step="0.25" inputmode="decimal" value="'+HOURS(i)+'"><b>saat</b></div><p class="sm muted">Önerilen süre: '+fh(i.h)+'. Bu konuya kendi sürene göre plan yapılır. Çeyrek saat (0,25) adımlarla girebilirsin.</p><div class="row" style="margin-top:14px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ghost" data-act="hreset" data-id="'+i.id+'">Önerilene dön</button><button class="btn ghost" data-act="mclose">Vazgeç</button><button class="btn" data-act="hsave" data-id="'+i.id+'">Kaydet</button></div>')},
 hsave(t){const v=parseFloat(String($('#hv').value).replace(',','.'));if(!(v>=0.25&&v<=60)){toast('0,25 ile 60 saat arasında bir süre gir');return}S.hours=S.hours||{};S.hours[t.dataset.id]=v;save();closeModal();render();toast('Süre güncellendi, plan yenilendi ✓')},
 hreset(t){if(S.hours)delete S.hours[t.dataset.id];save();closeModal();render()},
 mclose(){closeModal()}
};
function milestone(){
 const p=Math.round(doneCount()/ITEMS.length*100);
 const m=[100,75,50,25].find(x=>p>=x&&S.seen<x);
 if(m){S.seen=m;toast(m===100?'Tüm konular tamam! Şimdi tekrar ve deneme zamanı 🏆':'%'+m+' tamamlandı! Böyle devam 🎉')}
}
document.addEventListener('click',e=>{
 if(e.target.id==='modal'){closeModal();return}
 const t=e.target.closest('[data-act]');
 if(!t){if(!e.target.closest('#pop'))$('#pop').hidden=true;return}
 if(t.dataset.act!=='palette'&&!t.closest('#pop'))$('#pop').hidden=true;
 A[t.dataset.act]&&A[t.dataset.act](t,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('change',e=>{
 const c=e.target.dataset.chg;if(!c)return;const v=e.target.value;
 if(c==='weeksR'){S.weeks=+v}
 else if(c==='final'){S.finalDays=+v}
 else if(c==='every'){S.reviewEvery=+v}
 else if(c==='review'){S.reviewDay=+v;if(S.socialDay===S.reviewDay)S.socialDay=-1}
 else if(c==='social'){S.socialDay=+v;if(S.socialDay===S.reviewDay)S.reviewDay=(S.reviewDay+1)%7}
 else if(c==='start'){S.startDate=v||iso(sod(new Date()))}
 else if(c==='name'){S.name=v.trim().slice(0,24);save();return}
 else return;
 save();render();
});
document.addEventListener('input',e=>{
 const c=e.target.dataset.chg;
 if(c==='accent'){S.accent=e.target.value;save();applyTheme()}
 else if(c==='hue'){S.accent=hsl2hex(+e.target.value,78,56);save();applyTheme()}
 else if(c==='weeksR'){const w=+e.target.value;$('#wl').textContent=w;const st=addD(PLAN.start,w*7-1);const mx=addD(pd(EX[0].d),-S.finalDays-1);$('#wd').textContent=fd(st>mx?mx:st)}
});
$('#sw').innerHTML=PAL.map(c=>'<button data-act="sw" data-c="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>').join('');
applyTheme();render();
let lastDay=iso(new Date());
setInterval(()=>{const d=iso(new Date());if(d!==lastDay){lastDay=d;render()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastDay=iso(new Date());render()}});
})();
</script>
</body>
</html>
