<script>
try{var s=JSON.parse(localStorage.getItem('agsYolArkadasi.v1')||'{}');var t=s.theme||'auto';
document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{--accent:#41A6D9;--on-accent:#fff;--bg:#f4f5fb;--card:#fff;--text:#14172b;--muted:#656b85;--line:#e4e7f2;
--soft:color-mix(in srgb,var(--accent) 11%,var(--card));--ok:#16a34a;--warn:#d97706;--bad:#dc2626;color-scheme:light}
:root[data-theme=dark]{--bg:#0d0f1e;--card:#171a2f;--text:#eef0ff;--muted:#9aa1c4;--line:#272b4a;
--soft:color-mix(in srgb,var(--accent) 20%,var(--card));color-scheme:dark}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;overscroll-behavior-y:none;padding-bottom:calc(92px + env(safe-area-inset-bottom));transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
html{background:var(--bg);height:100%;overscroll-behavior-y:none}
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:60px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ff5fa2));display:grid;place-items:center;color:var(--on-accent);flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--accent);flex:none;transition:.2s}
.tbtn:active{transform:scale(.92)}.tbtn svg{width:21px;height:21px}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}.bt small{font-size:11px;color:var(--muted);font-weight:700}
.pop{position:absolute;right:16px;top:64px;width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.pop[hidden]{display:none}
.pop h3{font-size:14px;margin-bottom:10px}
.sw{display:flex;flex-wrap:wrap;gap:9px}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 2.5px var(--text)}
.pop label{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted)}
.pop input[type=color]{width:44px;height:34px;border:0;border-radius:10px;background:none;padding:0;cursor:pointer}

/* ---------- Plan motoru ---------- */
function buildPlan(){
 const today=sod(new Date()),exam=pd(EX[0].d),lastDay=addD(pd(EX[1].d),0);
 let start=pd(S.startDate);if(start<today)start=today;
 const finalN=S.finalDays,N=S.reviewEvery||1,m0=addD(start,-wdi(start));
 const isRev=d=>Math.floor(diffD(m0,d)/7)%N===N-1;
 const maxEnd=addD(exam,-finalN-1);
 const maxWeeks=Math.max(1,Math.floor((diffD(start,exam)-finalN)/7));
 let studyEnd=addD(start,S.weeks*7-1);
 if(studyEnd>maxEnd)studyEnd=maxEnd;
 const rem=ITEMS.filter(i=>!S.done[i.id]);
 const off=new Set(S.offDates);
 const days=[];
 for(let d=start;d<=lastDay;d=addD(d,1)){
  const w=wdi(d),key=iso(d),cap=(S.avail[w]||[]).filter(Boolean).length*BH;
  let type;
  if(d>=exam)type='exam';
  else if(key===iso(addD(exam,-1)))type='eve';
  else if(off.has(key)||w===S.socialDay)type='social';
  else if(d>studyEnd)type=(w===S.reviewDay)?'mock':'final';
  else if(w===S.reviewDay&&isRev(d))type='review';
  else type='study';
  if(cap===0&&['study','review','final','mock'].includes(type))type='off';
  days.push({date:d,key,w,type,cap,tasks:[]});
 }
 const sd=days.filter(x=>x.type==='study');
 const need=rem.reduce((a,i)=>a+HOURS(i),0);
 const capT=sd.reduce((a,x)=>a+x.cap,0);
 const ratio=capT?Math.min(1,need/capT):0;
 let cum=0,given=0,idx=0,left=rem[0]?HOURS(rem[0]):0;const endOf={};
 for(const day of sd){
  cum+=day.cap;
  const target=cum*ratio;let q=target-given;given=target;
  while(q>1e-6&&idx<rem.length){
   const it=rem[idx];
   if(left>=HOURS(it)-1e-9&&q<0.25){given-=q;break}
   let t=Math.min(q,left);
   q-=t;left-=t;
   if(left>1e-6&&left<=0.5&&q<=1e-6){t+=left;given+=left;left=0}
   day.tasks.push({id:it.id,t:it.t,s:SUB[it.s].n,c:SUB[it.s].c,h:t});
   if(left<1e-6){endOf[it.id]=day.key;idx++;left=rem[idx]?HOURS(rem[idx]):0}
  }
 }
 const effDate=id=>S.done[id]?pd(S.done[id]):(endOf[id]?pd(endOf[id]):null);
 const win=(day,a,b)=>ITEMS.filter(i=>{const e=effDate(i.id);if(!e)return false;const df=diffD(e,day.date);return df>=a&&df<=b});
 const acc='var(--accent)';
 let rc=0,fc=0,mc=0;
 for(const day of days){
  if(day.type==='review'){
   rc++;const wk=win(day,1,7*N),sp=rc%2===0?win(day,7*N+8,7*N+28):[];const c=day.cap;
   const nm=l=>l.map(i=>SUB[i.s].n+': '+i.t);
   if(wk.length)day.tasks.push({t:N===1?'Haftalık tekrar':N+' haftalık tekrar',s:N===1?'Geçen hafta bitirdiğin konular':'Son '+N+' haftada bitirdiğin konular',c:acc,h:c*(sp.length?.45:.6),sub:nm(wk)});
   if(sp.length)day.tasks.push({t:'Aralıklı tekrar',s:'2–5 hafta önceki konular unutulmasın',c:acc,h:c*.25,sub:nm(sp)});
   if(!wk.length&&!sp.length)day.tasks.push({t:'Eksik konu tamamlama',s:'Geride kalanları yakala, soru çöz',c:acc,h:c*.8});
   day.tasks.push({t:'Yanlış defteri + mini deneme',s:'Yanlışlarını tekrar çöz',c:acc,h:Math.max(.5,c-day.tasks.reduce((a,t)=>a+t.h,0))});
  }else if(day.type==='final'){
   const f=FCYC[fc%FCYC.length];fc++;
   day.tasks.push({t:f[0],s:'Özet çıkar, soru çöz, eksik konuyu kapat',c:SUB[f[1]].c,h:day.cap});
  }else if(day.type==='mock'){
   mc++;
   day.tasks.push({t:mc%2?'MEB-AGS deneme sınavı':'ÖABT deneme sınavı',s:'Gerçek sınav süresiyle çöz',c:acc,h:Math.min(3,day.cap*.6)});
   day.tasks.push({t:'Deneme analizi',s:'Yanlışları ve boşları konulara ayır',c:acc,h:Math.max(1,day.cap-Math.min(3,day.cap*.6))});
  }else if(day.type==='eve'){
   day.tasks.push({t:'Hafif tekrar, erken uyu',s:'Yeni konu yok. Çantanı ve kimliğini hazırla.',c:'var(--ok)',h:Math.min(2,day.cap||2)});
  }else if(day.type==='exam'){
   const isAgs=iso(day.date)===EX[0].d;
   day.tasks.push({t:isAgs?'MEB-AGS':'MEB-AGS-ÖABT',s:'Derin nefes. Hazırlandın, gerisi sadece uygulama.',c:acc,h:0});
  }
 }
 return{days,rem,need,capT,short:Math.max(0,need-capT),studyEnd,maxWeeks,start,endOf,sdN:sd.length,capped:S.weeks*7-1>diffD(start,studyEnd)};
}

  return '<div class="tp'+(on?' on':'')+'"><button class="chk" data-act="done" data-id="'+i.id+'" aria-label="İşaretle">'+CHK+'</button><span class="dot" style="--c:'+SUB[i.s].c+';align-self:stretch"></span><div class="tx"><div class="tt">'+i.t+'</div><div class="ts">'+SUB[i.s].n+(on?' · bitti '+fd(pd(S.done[i.id])):(pl?' · planlanan bitiş '+fd(pd(pl)):''))+'</div></div><button class="mini" data-act="edith" data-id="'+i.id+'" aria-label="Süreyi düzenle">⏱ '+fh(HOURS(i))+(cu?' ✎':'')+'</button></div>'}).join('')+'</section>';
 return html;
}
function apStatus(e,today){
 if(!e.ap)return null;
 const a=pd(e.ap[0]),b=pd(e.ap[1]);
 if(today<a)return['Başvuru '+diffD(today,a)+' gün sonra açılır',''];
 if(today<=b)return['Başvuru açık · '+(diffD(today,b)===0?'son gün!':diffD(today,b)+' gün kaldı'),'ok'];
 if(e.late&&today<=pd(e.late))return['Geç başvuru: '+fd(pd(e.late)),'warn'];
 return['Başvuru kapandı',''];
}
function vExams(){
 const today=sod(new Date());
 const list=EX.map(e=>({...e,dd:diffD(today,pd(e.d)),pin:S.pins.includes(e.id)}));
 let L=list.filter(e=>S.exf==='pins'?e.pin:S.exf==='soon'?e.dd>=0:true);
 L.sort((a,b)=>(a.pin!==b.pin?(a.pin?-1:1):0)||((a.dd<0)-(b.dd<0))||(a.dd-b.dd));
 return '<h1 class="greet">Sınavlar</h1><p class="quote">Yıldızladığın sınavlar ana ekranda öne çıkar. Tarihler 2027 ÖSYM takvimindendir; resmî duyurularla kontrol et.</p>'+
 '<div class="chips"><button class="chip'+(S.exf==='pins'?' on':'')+'" data-act="exf" data-v="pins">⭐ Takip ettiklerim</button><button class="chip'+(S.exf==='soon'?' on':'')+'" data-act="exf" data-v="soon">Yaklaşanlar</button><button class="chip'+(S.exf==='all'?' on':'')+'" data-act="exf" data-v="all">Tümü</button></div>'+
 (L.length?L.map(e=>{
  const st=apStatus(e,today),main=e.id==='ags'||e.id==='oabt';
  return '<section class="card ex'+(main?' main':'')+(e.dd<0?' past':'')+'"><div class="exd"><b>'+(e.dd>=0?e.dd:'✓')+'</b><small>'+(e.dd===0?'bugün':e.dd>0?'gün':'geçti')+'</small>'+(e.dd>6?'<small>('+Math.floor(e.dd/7)+' hf)</small>':'')+'</div>'+
  '<div class="tx"><div class="tt">'+e.n+'</div><div class="ts">'+fdl(pd(e.d))+'</div>'+(e.dd>0?'<div class="ts">'+Math.floor(e.dd/7)+' hafta '+e.dd%7+' gün</div>':'')+
  (st&&e.dd>0?'<div class="ts" style="'+(st[1]==='ok'?'color:var(--ok);font-weight:700':st[1]==='warn'?'color:var(--warn);font-weight:700':'')+'">'+st[0]+'</div>':'')+
  '<div class="ts">Sonuç: '+fd(pd(e.res))+'</div></div><button class="star'+(e.pin?' on':'')+'" data-act="pin" data-id="'+e.id+'" aria-label="Takip et">'+(e.pin?'★':'☆')+'</button></section>';
 }).join(''):'<div class="note">Henüz yıldızladığın sınav yok. “Tümü”nden seç.</div>');
}
function vSettings(){

 const dOpts=DAYS.map((d,i)=>[i,d]);
 return '<h1 class="greet">Ayarlar</h1><p class="quote">Müsait olduğun saatleri işaretle; plan buna göre şekillenir.</p>'+
 '<section class="card"><h2>Müsait saatlerim</h2><p class="sm muted" style="margin-bottom:12px">Dokunarak aç/kapat. Gün adına dokunursan tüm satır değişir. Her kutu 3 saatlik bir blok. Haftalık toplam: <b>'+wkh+' sa</b></p>'+
 '<div class="chips"><button class="chip" data-act="preset" data-p="day">Gündüz</button><button class="chip" data-act="preset" data-p="eve">Akşamlar</button><button class="chip" data-act="preset" data-p="all">Hepsi</button><button class="chip" data-act="preset" data-p="none">Temizle</button></div>'+
 '<div class="agrid"><span></span>'+BLOCKS.map(b=>'<span class="gh">'+b+'</span>').join('')+
 DAYS.map((n,w)=>'<button class="gl" data-act="rowav" data-w="'+w+'">'+DS[w]+'</button>'+BLOCKS.map((b,i)=>'<button class="cell'+(S.avail[w][i]?' on':'')+'" data-act="av" data-w="'+w+'" data-i="'+i+'" aria-label="'+n+' '+b+'"></button>').join('')).join('')+'</div></section>'+
 '<section class="card"><h2>Haftalık düzen</h2><div class="fld"><label>Tekrar günü (tekrar + mini deneme yapılan gün)</label><select data-chg="review">'+opt(dOpts,S.reviewDay)+'</select></div>'+
 '<div class="fld"><label>Tekrar günü ne sıklıkla olsun?</label><select data-chg="every">'+opt([[1,'Her hafta'],[2,'2 haftada bir'],[3,'3 haftada bir'],[4,'4 haftada bir']],S.reviewEvery||1)+'</select></div>'+
 '<div class="fld"><label>Sosyal gün (ders yok, kafa dinle)</label><select data-chg="social">'+opt([[-1,'Yok']].concat(dOpts),S.socialDay)+'</select></div>'+
 '<div class="fld"><label>Sınavdan önce genel tekrar süresi</label><select data-chg="final">'+opt([[7,'Son 7 gün (1 hafta)'],[14,'Son 14 gün (2 hafta)'],[21,'Son 21 gün (3 hafta)'],[28,'Son 28 gün (4 hafta)'],[35,'Son 35 gün (5 hafta)'],[42,'Son 42 gün (6 hafta)']],S.finalDays)+'</select></div>'+
 '<div class="fld"><label>Planın başlangıç tarihi</label><input type="date" data-chg="start" value="'+S.startDate+'"></div></section>'+
 '<section class="card"><h2>Tek seferlik boş günler</h2><p class="sm muted">Düğün, hasta olma, seyahat… O gün plana ders konmaz.</p><div class="row" style="margin-top:10px"><input type="date" id="offd"><button class="btn" data-act="addoff">Ekle</button></div>'+
 '<div class="tags">'+S.offDates.sort().map(d=>'<span class="badge">'+fd(pd(d))+' <button data-act="deloff" data-d="'+d+'" aria-label="Sil" style="font-weight:900">×</button></span>').join('')+'</div></section>'+
 '<section class="card"><h2>Kişisel</h2><div class="fld"><label>Adın (selamlama için)</label><input type="text" data-chg="name" value="'+S.name.replace(/"/g,'&quot;')+'" placeholder="Örn. Ayşe"></div>'+
 '</section>'+
 '<section class="card"><h2>👋 Tanıtım</h2><p class="sm muted">Uygulamanın kısa tanıtımı '+(S.introOff?'şu an <b>gösterilmiyor</b>':'şu an <b>her açılışta gösteriliyor</b> (“Bir daha gösterme” kutusunu işaretleyene kadar)')+'.</p><div style="height:12px"></div><button class="btn ghost" data-act="introopen">Tanıtımı göster</button></section>'+
 '<section class="card"><h2>💾 Yedekle ve başka cihaza taşı</h2>'+
 '<p class="sm muted">Yaptığın işaretlemeler, planın ve ayarların <b>sadece bu telefonda/bilgisayarda</b> saklanır. Telefon değiştirirsen ya da tarayıcı verilerini silersen kaybolabilir. Yedek almak bunu önler.</p>'+
 '<ol class="sm muted" style="padding-left:20px;margin:10px 0">'+
 '<li><b>Yedeği kopyala</b> düğmesine bas. Bir uzun metin kopyalanır.</li>'+
 '<li>Bu metni kendine mesaj at ya da bir nota yapıştır (WhatsApp, Notlar vb.).</li>'+
 '<li>Yeni cihazda uygulamayı aç, <b>Yedeği yükle</b>\'ye bas ve metni yapıştır. Her şey geri gelir.</li></ol>'+
 '<div class="row" style="flex-wrap:wrap"><button class="btn ghost" data-act="export">Yedeği kopyala</button><button class="btn ghost" data-act="import">Yedeği yükle</button></div></section>'+
 '<section class="card" style="border-color:color-mix(in srgb,var(--bad) 40%,var(--line))"><h2>⚠️ Her şeyi sıfırla</h2>'+
 '<p class="sm muted">Bu düğme uygulamayı ilk günkü haline döndürür: işaretlediğin tüm konular, çalışma saatlerin, seri, müsaitlik ve ayarların silinir. <b>Geri alınamaz.</b> Emin değilsen önce yukarıdan yedek al.</p>'+
 '<div style="height:12px"></div><button class="btn red" data-act="reset">Her şeyi sıfırla</button></section>';
}
const NAV=[['home','Bugün','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
['plan','Plan','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>'],
['topics','Konular','<path d="M10 6h11M10 12h11M10 18h11M3.5 6l1.5 1.5L7.5 4.5M3.5 12l1.5 1.5 2.5-3M3.5 18l1.5 1.5 2.5-3"/>'],
['exams','Sınavlar','<path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/>'],
['settings','Ayarlar','<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/>']];
const VIEWS={home:vHome,plan:vPlan,topics:vTopics,exams:vExams,settings:vSettings};
function render(){
 PLAN=buildPlan();
 $('#nav').innerHTML=NAV.map(n=>'<button class="'+(S.tab===n[0]?'on':'')+'" data-act="tab" data-v="'+n[0]+'"><svg viewBox="0 0 24 24">'+n[2]+'</svg>'+n[1]+'</button>').join('');
 $('#view').innerHTML=(VIEWS[S.tab]||vHome)();
 if(S.tab==='plan')syncTgl();
}

/* ---------- Etkileşim ---------- */
const A={
 tab(t){S.tab=t.dataset.v;save();render();scrollTo({top:0})},
 theme(){const o=['auto','light','dark'];S.theme=o[(o.indexOf(S.theme)+1)%3];save();applyTheme();toast(TN[S.theme])},
 palette(){const p=$('#pop');p.hidden=!p.hidden},
 sw(t){S.accent=t.dataset.c;save();applyTheme()},
 weeks(t){S.weeks=+t.dataset.v;save();render()},
 filter(t){S.filter=t.dataset.v;save();render()},
 exf(t){S.exf=t.dataset.v;save();render()},
 pin(t){const i=S.pins.indexOf(t.dataset.id);i<0?S.pins.push(t.dataset.id):S.pins.splice(i,1);save();render()},
 done(t){const id=t.dataset.id;if(S.done[id])delete S.done[id];else{S.done[id]=iso(sod(new Date()));const r=t.getBoundingClientRect();boom(r.left+14,r.top+14);milestone()}save();render()},
 finish(t){const r=t.getBoundingClientRect();boom(r.left+r.width/2,r.top);S.done[t.dataset.id]=iso(sod(new Date()));milestone();save();render()},
 tick(t){
  const k=t.dataset.k,h=+t.dataset.h,d=t.dataset.d;
  if(S.ticks[k]){delete S.ticks[k];S.log[d]=Math.max(0,(S.log[d]||0)-h)}
  else{S.ticks[k]=1;S.log[d]=(S.log[d]||0)+h;const r=t.getBoundingClientRect();boom(r.left+14,r.top+14);toast(['Harika, devam! 💪','Bir adım daha yaklaştın.','İşte bu tempo! 🔥','Süper, bunu da hallettin.'][Math.floor(Math.random()*4)])}
  save();render()},
 hour(t){const k=iso(sod(new Date()));S.log[k]=Math.max(0,Math.round(((S.log[k]||0)+ +t.dataset.v)*2)/2);save();render()},
 av(t){const w=t.dataset.w,i=+t.dataset.i;S.avail[w][i]=S.avail[w][i]?0:1;save();render()},
 rowav(t){const r=S.avail[t.dataset.w],on=r.every(Boolean);for(let i=0;i<6;i++)r[i]=on?0:1;save();render()},
 preset(t){const p=t.dataset.p,m={day:[0,1,1,1,0,0],eve:[0,0,0,1,1,1],all:[1,1,1,1,1,1],none:[0,0,0,0,0,0]}[p];S.avail=av(m);save();render()},
 addoff(){const v=$('#offd').value;if(v&&!S.offDates.includes(v)){S.offDates.push(v);save();render()}},
 deloff(t){S.offDates=S.offDates.filter(x=>x!==t.dataset.d);save();render()},
 export(){const s=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('Yedek kopyalandı ✓ Şimdi bir yere yapıştırıp sakla')).catch(()=>{modal('<h2>Yedek metni</h2><p class="sm muted">Otomatik kopyalanamadı. Aşağıdaki metne uzun basıp “Tümünü seç” ve “Kopyala” de, sonra bir yere yapıştırıp sakla.</p><textarea id="bk" readonly rows="6">'+s.replace(/</g,'&lt;')+'</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="mclose">Tamam</button></div>');const x=$('#bk');x.focus();x.select()})},
 import(){modal('<h2>Yedeği yükle</h2><p class="sm muted">Daha önce kopyaladığın yedek metnini aşağıya yapıştır. Yüklenince şu anki ilerlemenin yerine geçer.</p><textarea id="bk" rows="6" placeholder="Yedek metnini buraya yapıştır"></textarea><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-act="mclose">Vazgeç</button><button class="btn" data-act="importgo">Yedeği yükle</button></div>')},
 importgo(){const s=($('#bk').value||'').trim();if(!s)return;try{const o=JSON.parse(s);if(typeof o!=='object'||!o)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);save();closeModal();applyTheme();render();toast('Yedek yüklendi ✓')}catch(e){toast('Bu metin geçerli bir yedek değil')}},
 reset(){
  const dn=doneCount(),hrs=Object.values(S.log).reduce((a,b)=>a+b,0),days=Object.keys(S.log).filter(k=>S.log[k]>0).length;
  modal('<h2>⚠️ Her şey sıfırlansın mı?</h2><p class="sm muted">“Evet, sıfırla”ya basarsan şunlar silinir:</p>'+
  '<ul class="sm" style="padding-left:20px;margin:10px 0;line-height:1.7"><li><b>'+dn+' konu</b> işaretin (hepsi “bitmedi” olur)</li>'+
  '<li><b>'+(hrs?fh(hrs):'0 saat')+'</b> çalışma kaydın ('+days+' gün) ve serin</li>'+
  '<li>Müsaitlik saatlerin, tekrar/sosyal gün seçimin ve boş günlerin</li>'+
  '<li>Hafta sayısı, başlangıç tarihi ve genel tekrar süresi ayarların</li><li>Konular için değiştirdiğin süreler</li>'+
  '<li>Seçtiğin renk, tema ve adın da varsayılana döner</li></ul>'+
  '<p class="sm"><b>Bu işlem geri alınamaz.</b> Emin değilsen “Vazgeç”e bas; önce yedek almak için Ayarlar’daki yedek kartını kullan.</p>'+
  '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-act="mclose">Vazgeç</button><button class="btn red" data-act="resetgo">Evet, sıfırla</button></div>')},
 resetgo(){S=JSON.parse(JSON.stringify(DEF));save();closeModal();applyTheme();render();scrollTo({top:0});toast('Her şey sıfırlandı')},
 toggleall(){const ds=$$('#view details'),all=ds.every(d=>d.open);ds.forEach(d=>d.open=all?d.dataset.now==='1':true);syncTgl()},
 edith(t){const i=ITEMS.find(x=>x.id===t.dataset.id);
  modal('<h2>Konu süresi</h2><p class="sm muted">'+SUB[i.s].n+' · '+i.t+'</p><div class="row" style="margin:14px 0 6px"><input type="number" id="hv" min="0.25" max="60" step="0.25" inputmode="decimal" value="'+HOURS(i)+'"><b>saat</b></div><p class="sm muted">Önerilen süre: '+fh(i.h)+'. Bu konuya kendi sürene göre plan yapılır. Çeyrek saat (0,25) adımlarla girebilirsin.</p><div class="row" style="margin-top:14px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ghost" data-act="hreset" data-id="'+i.id+'">Önerilene dön</button><button class="btn ghost" data-act="mclose">Vazgeç</button><button class="btn" data-act="hsave" data-id="'+i.id+'">Kaydet</button></div>')},
 hsave(t){const v=parseFloat(String($('#hv').value).replace(',','.'));if(!(v>=0.25&&v<=60)){toast('0,25 ile 60 saat arasında bir süre gir');return}S.hours=S.hours||{};S.hours[t.dataset.id]=v;save();closeModal();render();toast('Süre güncellendi, plan yenilendi ✓')},
 hreset(t){if(S.hours)delete S.hours[t.dataset.id];save();closeModal();render()},
 intro(t){const i=+t.dataset.i;showIntro(i,i>=tourI?1:-1)},
 introskip(){closeTour()},
 introflag(t){S.introOff=!S.introOff;save();t.querySelector('.ck').classList.toggle('dn',S.introOff);t.setAttribute('aria-checked',S.introOff);if(S.introOff)toast('Tamam, tanıtım bir daha gösterilmeyecek. Ayarlar’dan açabilirsin')},
 tourscroll(){const b=$('#tour .tbody');if(b)b.scrollBy({top:Math.max(160,b.clientHeight*.6),behavior:'smooth'})},
 intronever(){S.introOff=true;save();closeTour();toast('Tanıtım artık gösterilmeyecek. Ayarlar’dan tekrar açabilirsin')},
 introopen(){S.introOff=false;save();showIntro(0)},
 tourgo(){closeTour();S.tab='settings';save();render();scrollTo({top:0})},
 mclose(){closeModal()}
};
function milestone(){
 const p=Math.round(doneCount()/ITEMS.length*100);
 const m=[100,75,50,25].find(x=>p>=x&&S.seen<x);
 if(m){S.seen=m;toast(m===100?'Tüm konular tamam! Şimdi tekrar ve deneme zamanı 🏆':'%'+m+' tamamlandı! Böyle devam 🎉')}
}
document.addEventListener('click',e=>{
 if(e.target.id==='modal'){closeModal();return}
 const t=e.target.closest('[data-act]');
 if(!t){if(!e.target.closest('#pop'))$('#pop').hidden=true;return}
 if(t.dataset.act!=='palette'&&!t.closest('#pop'))$('#pop').hidden=true;
 A[t.dataset.act]&&A[t.dataset.act](t,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeTour()}else if($('#tour')){if(e.key==='ArrowRight'&&tourI<INTRO.length-1)showIntro(tourI+1,1);if(e.key==='ArrowLeft'&&tourI>0)showIntro(tourI-1,-1)}});
document.addEventListener('change',e=>{
 const c=e.target.dataset.chg;if(!c)return;const v=e.target.value;
 if(c==='weeksR'){S.weeks=+v}
 else if(c==='final'){S.finalDays=+v}
 else if(c==='every'){S.reviewEvery=+v}
 else if(c==='review'){S.reviewDay=+v;if(S.socialDay===S.reviewDay)S.socialDay=-1}
 else if(c==='social'){S.socialDay=+v;if(S.socialDay===S.reviewDay)S.reviewDay=(S.reviewDay+1)%7}
 else if(c==='start'){S.startDate=v||iso(sod(new Date()))}
 else if(c==='name'){S.name=v.trim().slice(0,24);save();return}
 else return;
 save();render();
});
document.addEventListener('input',e=>{
 const c=e.target.dataset.chg;
 if(c==='accent'){S.accent=e.target.value;save();applyTheme()}
 else if(c==='hue'){S.accent=hsl2hex(+e.target.value,78,56);save();applyTheme()}
 else if(c==='weeksR'){const w=+e.target.value;$('#wl').textContent=w;const st=addD(PLAN.start,w*7-1);const mx=addD(pd(EX[0].d),-S.finalDays-1);$('#wd').textContent=fd(st>mx?mx:st)}
});
$('#sw').innerHTML=PAL.map(c=>'<button data-act="sw" data-c="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>').join('');
applyTheme();render();if(!S.introOff)showIntro(0);
let lastDay=iso(new Date());
setInterval(()=>{const d=iso(new Date());if(d!==lastDay){lastDay=d;render()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastDay=iso(new Date());render()}});
})();
</script>
