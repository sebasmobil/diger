<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sevdiğin rengi seç</title>
<style>
:root{--bg:#f6f4f1;--ink:#1d1b19;--mute:#6d675f;--line:#d9d4cc;--card:#fff;--hue:200}
@media (prefers-color-scheme:dark){:root{--bg:#171615;--ink:#f1ede7;--mute:#a39c92;--line:#3a3733;--card:#222120}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);height:100vh;height:100dvh;overflow:hidden}
main{max-width:520px;margin:0 auto;padding:12px 16px;height:100%;display:flex;flex-direction:column}
#secim{display:flex;flex-direction:column;flex:1;min-height:0}
.onizleme,.ton,.eylem{flex-shrink:0}
h1{font-size:1.3rem;line-height:1.2;margin:0 0 2px;font-weight:800}
.sub{margin:0 0 10px;color:var(--mute);font-size:.9rem}
.onizleme{border-radius:18px;padding:10px 16px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;transition:background-color .1s}
.onizleme b{font-size:1.3rem}
.onizleme span{font-variant-numeric:tabular-nums;font-weight:700}
.palet{position:relative;margin-top:10px;width:100%;flex:1;min-height:120px;border-radius:18px;border:1px solid var(--line);cursor:crosshair;touch-action:none;
background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(var(--hue),100%,50%));user-select:none;-webkit-user-select:none}
.ton{position:relative;margin-top:10px;height:36px;border-radius:19px;border:1px solid var(--line);touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;
background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.tut{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.ton .tut{top:50%}
:focus-visible{outline:3px solid #2b7de9;outline-offset:3px}
.eylem{display:flex;gap:10px;margin-top:12px}
button{font:inherit;font-weight:800;border-radius:14px;padding:14px 18px;cursor:pointer;flex:1}
.ana{background:var(--ink);color:var(--bg);border:0}
.ikinci{background:transparent;color:var(--ink);border:2px solid var(--line)}
.sonuc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;margin:auto 0}
.nokta{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;border:1px solid var(--line)}
.sonuc h2{margin:0 0 4px;font-size:1.4rem}
.sonuc p{margin:0 0 6px;color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Sevdiğin rengi seç</h1>
  <p class="sub">Paletin üzerinde parmağını gezdir, rengi bulunca bırak.</p>

  <section id="secim">
    <div class="onizleme" id="onizleme"><b id="ad"></b><span id="kod"></span></div>
    <div class="palet" id="palet" tabindex="0" role="application" aria-label="Renk paleti: ok tuşlarıyla renk seç">
      <div class="tut" id="pTut"></div>
    </div>
    <div class="ton" id="ton" tabindex="0" role="slider" aria-label="Ton" aria-valuemin="0" aria-valuemax="360">
      <div class="tut" id="tTut"></div>
    </div>
    <div class="eylem"><button class="ana" id="sec">Bu rengi seçtim</button></div>
  </section>

  <section id="bitti" class="sonuc" hidden>
    <div class="nokta" id="nokta"></div>
    <h2>Favori rengin: <span id="sAd"></span></h2>
    <p id="sKod"></p>
    <div class="eylem">
      <button class="ikinci" id="kopya">Kodu kopyala</button>
      <button class="ana" id="yeni">Yeniden seç</button>
    </div>
    <p id="durum" role="status" style="margin-top:10px"></p>
  </section>
</main>

<script>
const ADLAR=[["Kırmızı","#e03131"],["Turuncu","#f76707"],["Sarı","#fcc419"],["Limon","#a9d018"],["Yeşil","#2f9e44"],["Zümrüt","#0ca678"],["Turkuaz","#15aabf"],["Gökyüzü","#4dabf7"],["Mavi","#1c64d6"],["Lacivert","#1b2a6b"],["Mor","#7048e8"],["Lavanta","#b197fc"],["Pembe","#f06595"],["Gül","#c2255c"],["Kahverengi","#7f5539"],["Siyah","#1a1a1a"],["Gri","#868e96"],["Beyaz","#ffffff"],["Bordo","#7a1022"],["Bej","#d9c3a0"]];
const $=id=>document.getElementById(id);
let h=200,s=0.7,v=0.85,secilen="";

function hsvHex(h,s,v){const f=n=>{const k=(n+h/60)%6;const c=v-v*s*Math.max(0,Math.min(k,4-k,1));return Math.round(c*255).toString(16).padStart(2,"0")};
  return "#"+f(5)+f(3)+f(1)}
const rgb=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));
function yakin(x){const c=rgb(x);let en="",m=1e9;
  for(const [a,y] of ADLAR){const d=rgb(y).reduce((t,q,i)=>t+(q-c[i])**2,0);if(d<m){m=d;en=a}}return en}
function yazi(x){const [r,g,b]=rgb(x);return(r*299+g*587+b*114)/1000>150?"#1a1a1a":"#fff"}

function ciz(){
  const hex=hsvHex(h,s,v);
  document.documentElement.style.setProperty("--hue",h);
  $("pTut").style.left=s*100+"%";$("pTut").style.top=(1-v)*100+"%";$("pTut").style.background=hex;
  $("tTut").style.left=h/360*100+"%";$("tTut").style.background="hsl("+h+",100%,50%)";
  const o=$("onizleme");o.style.backgroundColor=hex;o.style.color=yazi(hex);
  $("ad").textContent=yakin(hex);$("kod").textContent=hex.toUpperCase();
  $("ton").setAttribute("aria-valuenow",Math.round(h));
  return hex}

function surukle(el,fn){
  const al=e=>{const r=el.getBoundingClientRect();
    fn(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)));ciz()};
  el.addEventListener("pointerdown",e=>{el.setPointerCapture(e.pointerId);al(e);
    const mv=ev=>al(ev),up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up)};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);e.preventDefault()});
}
surukle($("palet"),(x,y)=>{s=x;v=1-y});
surukle($("ton"),x=>{h=x*360});

$("palet").addEventListener("keydown",e=>{const d=e.shiftKey?0.1:0.02;
  if(e.key==="ArrowLeft")s=Math.max(0,s-d);else if(e.key==="ArrowRight")s=Math.min(1,s+d);
  else if(e.key==="ArrowUp")v=Math.min(1,v+d);else if(e.key==="ArrowDown")v=Math.max(0,v-d);else return;
  e.preventDefault();ciz()});
$("ton").addEventListener("keydown",e=>{const d=e.shiftKey?20:4;
  if(e.key==="ArrowLeft")h=(h-d+360)%360;else if(e.key==="ArrowRight")h=(h+d)%360;else return;
  e.preventDefault();ciz()});

$("sec").onclick=()=>{secilen=ciz();
  $("nokta").style.backgroundColor=secilen;$("sAd").textContent=yakin(secilen);
  $("sKod").textContent=secilen.toUpperCase()+" · RGB("+rgb(secilen).join(", ")+")";
  $("secim").hidden=true;$("bitti").hidden=false;$("durum").textContent="";window.scrollTo(0,0)};
$("yeni").onclick=()=>{$("bitti").hidden=true;$("secim").hidden=false};
$("kopya").onclick=async()=>{try{await navigator.clipboard.writeText(secilen.toUpperCase());$("durum").textContent="Kopyalandı."}
  catch(e){$("durum").textContent="Kopyalanamadı. Kodu elle seçip kopyalayabilirsin."}};
ciz();
</script>
</body>
</html>
