<title>Tarım Uygulaması 3.0</title>
<style>
:root{--bg:#eef2ea;--card:#fff;--ink:#1c2a1f;--mut:#5d6b5f;--line:#d5ddd0;--g:#2f5d3a;--g2:#e1ecdc;--w:#c58a1c;--w2:#f6e8c4;--neg:#b3392b;--pos:#2f7a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a14;--card:#1b261e;--ink:#e6eee2;--mut:#9aab9d;--line:#2d3b30;--g:#6fb37c;--g2:#233a29;--w:#e0a937;--w2:#3a3017;--neg:#ee7d6e;--pos:#7bcf88;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121a14;--card:#1b261e;--ink:#e6eee2;--mut:#9aab9d;--line:#2d3b30;--g:#6fb37c;--g2:#233a29;--w:#e0a937;--w2:#3a3017;--neg:#ee7d6e;--pos:#7bcf88;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);color:#fff;padding:12px 16px 0;background-image:repeating-linear-gradient(100deg,transparent 0 14px,rgba(255,255,255,.05) 14px 16px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;max-width:980px;margin:auto}
h1{font:700 22px/1.1 "Iowan Old Style",Georgia,serif;margin:0}
h1 small{font:500 12px system-ui;opacity:.75;margin-left:6px}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input,select{font-size:16px!important}
header select{width:auto;max-width:50%;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
header option{color:#000}
nav{display:flex;max-width:980px;margin:8px auto 0;gap:2px}
nav button{flex:1;background:none;border:0;color:#fff;opacity:.7;padding:10px 1px;font:600 14.5px system-ui;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{opacity:1;border-color:var(--w)}
main{max-width:980px;margin:auto;padding:16px}
h2{font:700 19px "Iowan Old Style",Georgia,serif;margin:22px 0 10px}
h3{font:700 17px "Iowan Old Style",Georgia,serif;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
h3 small{font:500 13px system-ui;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{display:block;color:var(--mut);font-size:13px}
.kpi b{display:block;font:700 22px/1.2 "Iowan Old Style",Georgia,serif}
.kpi i{font-style:normal;font-size:13px;color:var(--mut)}
.kpi.net{grid-column:1/-1;background:var(--g2);border-color:var(--g)}
.kpi.net b{font-size:34px}
.pos b{color:var(--pos)}.neg b{color:var(--neg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid>*{min-width:0}
label{font-size:13px;color:var(--mut);display:block}
label input,label select{margin-top:3px}
.ml{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.mr{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;margin-bottom:6px}
button.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 14px system-ui;cursor:pointer}
button.b.o{background:none;color:var(--g);border:1px solid var(--g)}
button.x{background:none;border:1px solid var(--line);border-radius:8px;color:var(--neg);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--w);outline-offset:1px}
.res{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;background:var(--w2);border-radius:8px;padding:8px 10px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;font-weight:600}
th{color:var(--mut);font-weight:600;font-size:13px}
tfoot td{font-weight:700;background:var(--w2);border:0}
.bar{display:grid;grid-template-columns:90px 1fr 84px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bar div{height:16px;background:var(--g2);border-radius:4px;overflow:hidden}
.bar div i{display:block;height:100%;background:var(--w);border-radius:4px}
.bar em{font-style:normal;text-align:right}
.fr{display:grid;grid-template-columns:1fr 100px 36px;gap:6px;margin-bottom:6px}
.cr{display:grid;grid-template-columns:1fr 36px;gap:6px;margin-bottom:6px}
.ca{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#dlg[hidden]{display:none}
#dlg .box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:360px}
#dlg p{margin:0 0 12px;font-size:16px}
#dlg .row{justify-content:flex-end}
button.dg{background:var(--neg)!important;color:#fff}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.li span{flex:1;font-weight:600}.li small{color:var(--mut)}
.li .x{width:36px;height:36px;display:grid;place-items:center;padding:0}
#dlg label{margin-bottom:10px}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.chk label{color:var(--ink);font-size:15px;display:flex;gap:6px;align-items:center}
.chk input{width:auto}
.ib{width:36px;height:36px;display:grid;place-items:center;padding:0}.ib.pen{color:var(--g)}
#dlg{touch-action:pan-y;overscroll-behavior:contain;overflow:hidden}
#dlg .box{max-height:85vh;max-height:85dvh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#dlg .box *{max-width:100%;min-width:0}
#dlg input[type=date]{display:block;-webkit-appearance:none;appearance:none}
body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
input[type=date]{min-height:42px;min-width:0;max-width:100%;width:100%;display:block;-webkit-appearance:none;appearance:none;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.sec{border-left:5px solid var(--c);background:var(--t);border-radius:10px;padding:10px 12px 12px;margin-top:10px}.sec h4{margin:0 0 8px;font:700 14px system-ui}
.s1{--c:#3f7a45;--t:rgba(63,122,69,.13)}.s2{--c:#c58a1c;--t:rgba(197,138,28,.16)}.s3{--c:#3d7fa8;--t:rgba(61,127,168,.14)}.s4{--c:#d0621f;--t:rgba(208,98,31,.13)}.s5{--c:#7d8a80;--t:rgba(125,138,128,.14)}.s6{--c:var(--g);--t:var(--g2)}
.tag{align-self:end;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:14px}.tag span{display:block;font-size:12px;color:var(--mut)}.sm{padding:5px 10px!important;font-size:13px!important}
html{overflow-x:hidden}main{min-width:0}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px 12px}.kvs span{display:block;font-size:12px;color:var(--mut)}.kvs b{font-size:15px}.kvs .pos b{color:var(--pos)}.kvs .neg b{color:var(--neg)}
.card.tot{background:var(--w2)}.card.sub{background:var(--bg);margin-bottom:8px}
.lm{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px}
.card{border:0;border-radius:14px;padding:0;overflow:hidden;box-shadow:none}
.card>h3{margin:0;padding:14px;cursor:pointer;align-items:center;justify-content:flex-start;gap:10px;-webkit-tap-highlight-color:transparent;font:600 16px system-ui}
.card>h3 small{margin-left:auto;font-size:13px;text-align:right}.card>h3 button{margin-left:auto}
.chev{width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 2px}
.card.open>h3 .chev{transform:rotate(45deg)}
.cb{padding:0 14px 14px;display:none}.card.open>.cb{display:block}
.card.tot{background:var(--g2)}
.kpi,.kpi.net{border:0}
.sec{background:transparent;border-left:3px solid var(--c);border-radius:0;padding:2px 0 2px 12px;margin-top:14px}
.sec h4{color:var(--mut);font:600 12px system-ui;text-transform:uppercase;letter-spacing:.05em}
#gear{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;font-size:22px;line-height:1;padding:0}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--w);color:#1c1a10;border:0;font:400 34px/1 system-ui;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:8}
#fab[hidden],#fm[hidden]{display:none}
#fm{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:grid;gap:2px}
#fm button{background:none;border:0;text-align:left;padding:13px 16px;font:600 15px system-ui;color:var(--ink);border-radius:10px}
main{padding-bottom:100px}
.note{color:var(--mut);font-size:13px;margin:6px 0 0}
</style>
</head>
<body>
<header>
 <div class="top"><h1>Tarım Uygulaması<small>v3.0</small></h1><select id="sel" aria-label="Sezon" onchange="S.cur=this.value;save();render()"></select><button id="gear" onclick="go('ayar')" aria-label="Ayarlar">⚙︎</button></div>
 <nav><button data-t="ozet" onclick="go('ozet')">Özet</button><button data-t="sezon" onclick="go('sezon')">Tarlalar</button><button data-t="isl" onclick="go('isl')">Defter</button><button data-t="sat" onclick="go('sat')">Satış</button></nav>
</header>
<main id="main"></main>
<button id="fab" onclick="$('#fm').hidden=!$('#fm').hidden" aria-label="Ekle">+</button>
<div id="fm" hidden><button onclick="$('#fm').hidden=true;editIsl()">Gübre, ilaç veya masraf ekle</button><button onclick="$('#fm').hidden=true;editSat()">Satış ekle</button><button onclick="$('#fm').hidden=true;addEkim()">Ürün ekimi ekle</button></div>
<div id="dlg" hidden><div class="box"><p id="dm"></p><div id="df"></div><input id="di" hidden><div class="row"><button class="b o" id="dn">Vazgeç</button><button class="b" id="dy">Tamam</button></div></div></div>
<script>
const K='tarim-uygulamasi';
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const n=v=>parseFloat(String(v).replace(',','.'))||0;
const f=(v,d=0)=>(+v).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){
 const fl=[['Arka',12],['Pış mala',11],['Naxır',10],['Saucağ',10.5],['Zengetli',13]].map(a=>({id:uid(),name:a[0],donum:a[1]}));
 const id=uid();
 return {cfg:{teneke:14,torba:50,para:'₺'},crops:['Arpa','Buğday','Nohut','Mercimek'],fields:fl,seasons:[{id,name:'Arpa 2026',rows:{},plans:{Arpa:{tohum:1900,gubre:1550,cesit:'',tcesit:''}}}],cur:id,gubre:['Üre','DAP','15-15-15','20-20-0','Amonyum nitrat']};
}
function mig(s){if(!s.birim)s.birim=['kg','lt','torba','teneke','adet'];if(!s.turler)s.turler=['İlkbahar gübresi','Yabani ot ilacı','Hastalık / böcek ilacı','Diğer'];if(!s.gubre)s.gubre=['Üre','DAP','15-15-15','20-20-0','Amonyum nitrat'];if(s.plan){const se=s.seasons.find(x=>x.id===s.cur)||s.seasons[0];if(se&&!se.plans)se.plans={[s.crops[0]||'Arpa']:{tohum:s.plan.tohum,gubre:s.plan.gubre,cesit:'',tcesit:''}};delete s.plan}if(!s.turler.includes('Masraf'))s.turler.push('Masraf');s.seasons.forEach(z=>{Object.keys(z.rows||{}).forEach(fid=>{const r=z.rows[fid];if(r.masraf&&r.masraf.length){z.isl=z.isl||[];r.masraf.forEach(m=>{if(n(m.t))z.isl.push({id:uid(),tur:'Masraf',tarih:r.ekim||new Date().toISOString().slice(0,10),cesit:'',urun:m.a||'Masraf',miktar:0,birim:'kg',tutar:n(m.t),tarlalar:[fid],not:''})});r.masraf=[]}})});return s}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.fields)return mig(s)}catch(e){}return mig(seed())}
let S=load(),tab='ozet';
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const cs=()=>S.seasons.find(s=>s.id===S.cur);
function row(se,fl){return se.rows[fl.id]||(se.rows[fl.id]={crop:S.crops[0]||'',donum:fl.donum,tohum:0,gubre:0,hasat:0,fiyat:0,masraf:[]})}
function share(se,x,fid){const fm=id=>S.fields.find(q=>q.id===id),w=id=>fm(id)?(x.esit?1:row(se,fm(id)).donum):0,D=x.tarlalar.reduce((a,id)=>a+w(id),0);return D?x.tutar*w(fid)/D:0}
function extra(se,fid){return (se.isl||[]).reduce((t,x)=>t+(x.tarlalar.includes(fid)?share(se,x,fid):0),0)}
function calc(r,se,fl){const x=se?extra(se,fl.id):0,m=r.masraf.reduce((a,y)=>a+n(y.t),0)+x,g=r.hasat*(avgP(se,r.crop)||r.fiyat);return{m,x,g,net:g-m,verim:r.donum?r.hasat/r.donum:0,kat:r.tohum?r.hasat/r.tohum:0}}
function go(t){tab=t;render();scrollTo(0,0)}
function ed(id,k,v){if(v==='__new'){render();addCrop();return}const r=row(cs(),S.fields.find(x=>x.id===id));r[k]=['crop','ekim','hasatT'].includes(k)?v:n(v);save();render()}
function addM(id){row(cs(),S.fields.find(x=>x.id===id)).masraf.push({a:'',t:0});save();render()}
function edM(id,i,k,v){row(cs(),S.fields.find(x=>x.id===id)).masraf[i][k]=k==='t'?n(v):v;save();render()}
function delM(id,i){row(cs(),S.fields.find(x=>x.id===id)).masraf.splice(i,1);save();render()}
const kv=a=>`<div class="kvs">${a.map(x=>`<div class="${x[2]||''}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`;
function kpi(l,v,s,c){return `<div class="kpi ${c||''}"><span>${l}</span><b>${v}</b>${s?`<i>${s}</i>`:''}</div>`}

function ozet(se){
 const P=S.cfg.para,T={d:0,h:0,m:0,g:0,t:0,gu:0},R=[];
 S.fields.forEach(fl=>{const r=row(se,fl);if(!r.crop)return;const c=calc(r,se,fl);R.push({fl,r,c});T.d+=r.donum;T.h+=r.hasat;T.m+=c.m;T.g+=c.g;T.t+=r.tohum;T.gu+=r.gubre});
 if(!R.length)return '<p class="empty">Bu sezonda ekili tarla yok. "Tarlalar" sekmesinden ürün seçin.</p>';
 const SD=satTop(se),net=T.g-T.m,mx=Math.max(1,...R.map(x=>x.c.verim));
 return `<div class="kpis">
 ${kpi('Ekili alan',f(T.d,1)+' dönüm')}${kpi('Toplam hasat',f(T.h)+' kg',f(T.h/1000,2)+' ton')}
 ${kpi('Ortalama verim',f(T.d?T.h/T.d:0)+' kg/dönüm',T.t?'1 kg tohum → '+f(T.h/T.t,1)+' kg':'')}
 ${kpi('Masraf',f(T.m)+' '+P,T.d?f(T.m/T.d)+' '+P+'/dönüm':'')}${kpi('Gelir',f(T.g)+' '+P,SD.t?'satılan '+f(SD.t)+' '+P+' · kalan alacak '+f(SD.t-SD.od)+' '+P:'')}
 ${kpi('Net kâr',f(net)+' '+P,T.d?f(net/T.d)+' '+P+' / dönüm':'',(net<0?'neg':'pos')+' net')}</div>
 <div class="card op"><h3>Dönüm başına verim</h3>${R.map(x=>`<div class="bar"><span>${esc(x.fl.name)}</span><div><i style="width:${x.c.verim/mx*100}%"></i></div><em>${f(x.c.verim)} kg</em></div>`).join('')}</div>
 <h2>Tarla tarla döküm</h2>${R.map(({fl,r,c})=>`<div class="card"><h3>${esc(fl.name)}<small>${esc(r.crop)} · net ${f(c.net)} ${P}</small></h3>${kv([['Dönüm',f(r.donum,1)],['Tohum',f(r.tohum)+' kg'],['Gübre',f(r.gubre)+' kg'],['Hasat',f(r.hasat)+' kg'],['Verim',f(c.verim)+' kg/dön'],['Kat',f(c.kat,1)],['Masraf',f(c.m)+' '+P],['Gelir',f(c.g)+' '+P],['Net',f(c.net)+' '+P,c.net<0?'neg':'pos']])}</div>`).join('')}
 <div class="card tot"><h3>Toplam</h3>${kv([['Dönüm',f(T.d,1)],['Tohum',f(T.t)+' kg'],['Gübre',f(T.gu)+' kg'],['Hasat',f(T.h)+' kg'],['Verim',f(T.d?T.h/T.d:0)+' kg/dön'],['Kat',f(T.t?T.h/T.t:0,1)],['Masraf',f(T.m)+' '+P],['Gelir',f(T.g)+' '+P],['Net',f(net)+' '+P,net<0?'neg':'pos']])}</div>
 <p class="note">Verim: kg/dönüm. Kat: hasat kg ÷ ekilen tohum kg. Satışı kayıtlı ürünlerde gelir, satışların ortalama fiyatıyla hesaplanır. Masraf = tarla masrafları + İşlemler sekmesindeki tutarların dönüme göre paylaşılan kısmı. Tutarlar ${P} cinsindendir.</p>`;
}

function sezon(se){return `<div class="row" style="margin:0 0 12px"><button class="b" onclick="addEkim()">+ Ürün ekimi</button></div><div class="card"><h3>Ekim planı<small>tohum ve gübre dağıtımı</small></h3>${plan(se)}</div>`+fieldsHtml(se)}
function fieldsHtml(se){
 const P=S.cfg.para;
 if(!S.fields.length)return '<p class="empty">Henüz tarla yok. Ayarlar sekmesinden tarla ekleyin.</p>';
 return S.fields.map(fl=>{
  const r=row(se,fl),c=calc(r,se,fl),id=fl.id;
  const num=(l,k)=>`<label>${l}<input inputmode="decimal" value="${r[k]||''}" placeholder="0" onchange="ed('${id}','${k}',this.value)"></label>`;
  return `<div class="card"><h3>${esc(fl.name)}<small>${esc(r.crop||'Ekilmedi')} · ${f(r.donum,1)} dönüm</small></h3><div class="sec s1"><h4>Ürün ve ekim</h4><div class="grid"><label>Ürün<select onchange="ed('${id}','crop',this.value)"><option value="">Ekilmedi</option>${S.crops.map(x=>`<option ${x===r.crop?'selected':''}>${esc(x)}</option>`).join('')}<option value="__new">+ Yeni ürün ekle…</option></select></label><label>Ekim tarihi<input type="date" value="${r.ekim||''}" onchange="ed('${id}','ekim',this.value)"></label>${num('Dönüm','donum')}</div></div>
  <div class="sec s2"><h4>Tohum</h4><div class="grid">${num('Ekilen tohum (kg)','tohum')}${r.tc?`<div class="tag"><span>Tohum çeşidi</span><b>${esc(r.tc)}</b></div>`:''}</div></div>
  <div class="sec s3"><h4>Ekim gübresi</h4><div class="grid">${num('Gübre (kg)','gubre')}${r.gc?`<div class="tag"><span>Gübre çeşidi</span><b>${esc(r.gc)}</b></div>`:''}</div></div>
  <div class="sec s4"><h4>Hasat ve fiyat</h4><div class="grid">${num('Hasat (kg)','hasat')}<label>Hasat tarihi<input type="date" value="${r.hasatT||''}" onchange="ed('${id}','hasatT',this.value)"></label>${num('Tahmini fiyat ('+P+'/kg)','fiyat')}</div></div>
  <div class="sec s5"><h4>İşlemler ve masraflar</h4>${(se.isl||[]).filter(x=>x.tarlalar.includes(id)).sort((a,b)=>b.tarih.localeCompare(a.tarih)).map(x=>`<div class="li"><span>${fd(x.tarih)} · ${esc(x.urun||x.cesit||x.tur)}</span><small>${f(share(se,x,id))} ${P}</small><button class="x ib pen" aria-label="Düzenle" onclick="editIsl('${x.id}')">${PEN}</button></div>`).join('')||'<p class="note" style="margin:0 0 8px">Henüz kayıt yok.</p>'}<div class="row"><button class="b o sm" onclick="editIsl(null,'${id}')">+ Bu tarlaya işlem / masraf ekle</button></div></div>
  <div class="sec s6"><h4>Sonuç</h4>${kv([['Verim',f(c.verim)+' kg/dön'],['Masraf',f(c.m)+' '+P],['Gelir',f(c.g)+' '+P],['Net',f(c.net)+' '+P,c.net<0?'neg':'pos']])}</div></div>`}).join('');
}

function gsel(v,cb){const o=S.gubre.slice();if(v&&!o.includes(v))o.push(v);return `<select onchange="${cb}"><option value="">Seçilmedi</option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function getPlan(se,c){se.plans=se.plans||{};return se.plans[c]||(se.plans[c]={tohum:0,gubre:0,cesit:'',tcesit:''})}
function plSet(ci,k,v){getPlan(cs(),S.crops[ci])[k]=['cesit','tcesit','tarih'].includes(k)?v.trim():n(v);save();render()}
function plan(se){
 const C=S.cfg,out=S.crops.map((c,ci)=>{const fs=S.fields.filter(fl=>row(se,fl).crop===c);if(!fs.length)return '';
  const p=getPlan(se,c),D=fs.reduce((a,fl)=>a+row(se,fl).donum,0);
  return `<div class="card op"><h3>${esc(c)}<small>${fs.length} tarla · ${f(D,1)} dönüm</small></h3><div class="grid">
  <label>Ekim tarihi<input type="date" value="${p.tarih||''}" onchange="plSet(${ci},'tarih',this.value)"></label>
  <label>Tohum çeşidi<input value="${esc(p.tcesit)}" placeholder="isteğe bağlı" onchange="plSet(${ci},'tcesit',this.value)"></label>
  <label>Toplam tohum (kg)<input inputmode="decimal" value="${p.tohum||''}" onchange="plSet(${ci},'tohum',this.value)"></label>
  <label>Ekim gübresi çeşidi${gsel(p.cesit,`plSet(${ci},'cesit',this.value)`)}</label>
  <label>Toplam gübre (kg)<input inputmode="decimal" value="${p.gubre||''}" onchange="plSet(${ci},'gubre',this.value)"></label></div>
  <div style="margin-top:10px">${fs.map(fl=>{const d=row(se,fl).donum,o=D?d/D:0;return `<div class="card sub"><h3>${esc(fl.name)}<button class="x ib pen" aria-label="Ürünü değiştir" onclick="moveField('${fl.id}')">${PEN}</button></h3>${kv([['Dönüm',f(d,1)],['Oran',f(o*100,2)+' %'],['Tohum',f(p.tohum*o,2)+' kg'],['Teneke',f(p.tohum*o/C.teneke,1)],['Gübre',f(p.gubre*o,2)+' kg'],['Torba',f(p.gubre*o/C.torba,2)]])}</div>`}).join('')}
  <div class="card tot sub"><h3>Toplam</h3>${kv([['Dönüm',f(D,1)],['Tohum',f(p.tohum,1)+' kg'],['Teneke',f(p.tohum/C.teneke,1)],['Gübre',f(p.gubre,1)+' kg'],['Torba',f(p.gubre/C.torba,2)]])}</div></div>
  <p class="note">Dönüm başına: ${f(D?p.tohum/D:0,1)} kg tohum, ${f(D?p.gubre/D:0,1)} kg gübre.</p><div class="row"><button class="b" onclick="applyPlan(${ci})">Bu planı uygula</button></div></div>`}).join('');
 return (out||'<p class="empty">Henüz ekili tarla yok. Yukarıdaki "+ Ürün ekimi" ile ürünü ve tarlaları seçin.</p>')+`<p class="note">1 teneke = ${C.teneke} kg, 1 torba = ${C.torba} kg. Her ürünün toplamı kendi tarlalarına dönüm oranına göre dağıtılır.</p>`}
function addEkim(){const se=cs();form('Ürün ekimi ekle',[{l:'Ürün (listeden seç)',t:'sel',list:'crops',v:S.crops[0]},{l:'Listede yoksa yeni ürün adı',v:''},{l:'Ekilen tarlalar',t:'chk',o:S.fields.map(q=>({id:q.id,name:q.name+' ('+(row(se,q).crop||'boş')+')',on:false}))},{l:'Ekim tarihi',t:'date',v:today()}],
 v=>{const c=v[1]||v[0];if(!c)return;if(!S.crops.includes(c))S.crops.push(c);v[2].forEach(id=>{const q=S.fields.find(z=>z.id===id);if(q){const r=row(se,q);r.crop=c;if(v[3])r.ekim=v[3]}});save();render()})}
function moveField(id){const se=cs(),q=S.fields.find(z=>z.id===id),r=row(se,q);form(q.name+' tarlasının ürünü',[{l:'Ürün (Ekilmedi seçersen plandan çıkar)',t:'sel',list:'crops',pre:['Ekilmedi'],v:r.crop||'Ekilmedi'},{l:'Ekim tarihi',t:'date',v:r.ekim||''}],v=>{const c=v[0]==='Ekilmedi'?'':v[0];if(c!==r.crop){r.crop=c;r.tohum=0;r.gubre=0;r.gc='';r.tc=''}if(v[1])r.ekim=v[1];save();render()})}
function applyPlan(ci){const se=cs(),c=S.crops[ci],p=getPlan(se,c),fs=S.fields.filter(fl=>row(se,fl).crop===c),D=fs.reduce((a,fl)=>a+row(se,fl).donum,0);
 fs.forEach(fl=>{const r=row(se,fl),o=D?r.donum/D:0;r.tohum=Math.round(p.tohum*o*100)/100;r.gubre=Math.round(p.gubre*o*100)/100;r.gc=p.cesit;r.tc=p.tcesit;if(p.tarih)r.ekim=p.tarih});save();go('sezon')}
const TUR=['İlkbahar gübresi','Yabani ot ilacı','Hastalık / böcek ilacı','Diğer'],BIRIM=['kg','lt','torba','teneke','adet'];
let fc='';
const fd=d=>d?d.split('-').reverse().join('.'):'',today=()=>new Date().toISOString().slice(0,10);
const crops=se=>[...new Set(S.fields.map(q=>row(se,q).crop).filter(Boolean))];
function isl(se){const P=S.cfg.para,cr=id=>{const q=S.fields.find(z=>z.id===id);return q?row(se,q).crop:''},L=(se.isl||[]).filter(x=>!fc||x.tarlalar.some(id=>cr(id)===fc)).sort((a,b)=>b.tarih.localeCompare(a.tarih)),T=L.reduce((a,x)=>a+x.tutar,0);
 return `<div class="row" style="margin:0 0 12px"><button class="b" onclick="editIsl()">+ İşlem / masraf ekle</button><select style="width:auto" aria-label="Ürün filtresi" onchange="fc=this.value;render()"><option value="">Tüm ürünler</option>${crops(se).map(c=>`<option ${c===fc?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`+(L.length?`<p class="note" style="margin:0 0 10px">${L.length} kayıt · toplam ${f(T)} ${P}</p>`+L.map(x=>`<div class="card"><h3>${esc(x.urun||x.cesit||x.tur)}<small>${fd(x.tarih)} · ${esc(x.tur)}</small></h3><p style="margin:0 0 4px"><b>${esc(x.tur)}</b>${x.cesit?' · '+esc(x.cesit):''}${x.miktar?' · '+f(x.miktar,1)+' '+x.birim:''}${x.tutar?' · '+f(x.tutar)+' '+P:''}</p><p class="note" style="margin:0">${x.tarlalar.map(id=>{const q=S.fields.find(z=>z.id===id);return q?esc(q.name)+' ('+esc(row(se,q).crop)+')':''}).filter(Boolean).join(', ')||'Tarla seçilmedi'}${x.not?' — '+esc(x.not):''}</p><div class="row"><button class="x ib pen" aria-label="Düzenle" onclick="editIsl('${x.id}')">${PEN}</button><button class="x ib" aria-label="Sil" onclick="delIsl('${x.id}')">✕</button></div></div>`).join(''):'<p class="empty">Defter boş. Gübre, ilaçlama ve her türlü masrafı + düğmesiyle ekleyin. Hangi tarlalara yapıldığını işaretlersiniz, tutar tarlalara paylaştırılır.</p>')}
function editIsl(id,pre){const se=cs(),x=id?se.isl.find(q=>q.id===id):null,fs=S.fields.filter(q=>row(se,q).crop).sort((a,b)=>row(se,a).crop.localeCompare(row(se,b).crop,'tr'));

 const close=ok=>{d.hidden=true;y.onclick=$('#dn').onclick=i.onkeydown=null;if(ok)cb(i.hidden?true:i.value.trim())};
 y.onclick=()=>close(1);$('#dn').onclick=()=>close(0);i.onkeydown=e=>{if(e.key==='Enter')close(1)}}
function delField(i){const fl=S.fields[i];ask('"'+fl.name+'" tarlası silinsin mi? Tüm sezonlardaki bu tarlaya ait kayıtlar da silinir.',{ok:'Sil',danger:1},()=>{S.fields.splice(i,1);S.seasons.forEach(s=>{delete s.rows[fl.id];(s.isl||[]).forEach(x=>x.tarlalar=x.tarlalar.filter(i=>i!==fl.id))});save();render()})}
function newSeason(){ask('Sezon adı (örn. Buğday 2027)',{def:'',ok:'Oluştur'},a=>{if(!a)return;const id=uid();S.seasons.push({id,name:a,rows:{}});S.cur=id;save();go('sezon')})}
function renSeason(){if(!cs())return;ask('Sezonun yeni adı',{def:cs().name,ok:'Kaydet'},a=>{if(a){cs().name=a;save();render()}})}
function delSeason(){const se=cs();if(!se)return;ask('"'+se.name+'" sezonu silinsin mi? Bu sezonun tüm kayıtları silinir.',{ok:'Sil',danger:1},()=>{S.seasons=S.seasons.filter(x=>x!==se);S.cur=S.seasons[0]?S.seasons[0].id:null;save();render()})}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tarim-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.fields||!d.seasons)throw 0;S=mig(d);save();render()}catch(e){ask('Geçersiz yedek dosyası.',{single:1},()=>{})}};r.readAsText(file)}

function render(){
 const se=cs();
 $('#sel').innerHTML=S.seasons.map(s=>`<option value="${s.id}" ${s.id===S.cur?'selected':''}>${esc(s.name)}</option>`).join('');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#fab').hidden=!se||tab==='ayar';$('#fm').hidden=true;$('#gear').style.background=tab==='ayar'?'rgba(255,255,255,.4)':'';
 $('#main').innerHTML=tab==='ayar'?ayar():!se?'<p class="empty">Sezon yok. Ayarlar sekmesinden yeni sezon ekleyin.</p>':({ozet,sezon,plan,isl,sat}[tab])(se);fold();
}
const OPEN=(()=>{try{return JSON.parse(localStorage.getItem(K+'-open'))||{}}catch(e){return{}}})();
function fold(){const cnt={};document.querySelectorAll('#main .card').forEach(c=>{const h=c.firstElementChild;if(!h||h.tagName!=='H3')return;
 let key=tab+'|'+S.cur+'|'+(h.firstChild.textContent||'').trim();cnt[key]=(cnt[key]||0)+1;key+='|'+cnt[key];
 const b=document.createElement('div');b.className='cb';while(h.nextSibling)b.appendChild(h.nextSibling);c.appendChild(b);
 const v=document.createElement('i');v.className='chev';h.insertBefore(v,h.firstChild);
 const on=key in OPEN?OPEN[key]:(c.classList.contains('sub')||c.classList.contains('tot')||c.classList.contains('op'));
 c.classList.toggle('open',!!on);h.setAttribute('role','button');h.tabIndex=0;
 const tg=()=>{c.classList.toggle('open');OPEN[key]=c.classList.contains('open');try{localStorage.setItem(K+'-open',JSON.stringify(OPEN))}catch(x){}};
 h.onclick=e=>{if(!e.target.closest('button'))tg()};h.onkeydown=e=>{if(e.key==='Enter'&&e.target===h)tg()}})}
render();
document.addEventListener('click',e=>{if(!e.target.closest('#fab,#fm'))$('#fm').hidden=true});
let sy=0;
new MutationObserver(()=>{const open=!$('#dlg').hidden,b=document.body,on=b.classList.contains('lock');if(open&&!on){sy=scrollY;b.style.top=-sy+'px';b.classList.add('lock')}else if(!open&&on){b.classList.remove('lock');b.style.top='';scrollTo(0,sy)}}).observe($('#dlg'),{attributes:true,attributeFilter:['hidden']});
$('#dlg').addEventListener('touchmove',e=>{if(!e.target.closest('.box'))e.preventDefault()},{passive:false});
</script>
</body>
